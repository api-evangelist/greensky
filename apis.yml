name: GreenSky
description: >-
  GreenSky is a financial-technology company that powers point-of-sale consumer
  financing. Through a network of federally insured bank partners and enrolled
  merchants, GreenSky enables consumers to apply for and use installment loans
  and revolving credit lines at the point of sale, with programs concentrated in
  home-improvement and elective-healthcare financing. GreenSky Servicing, LLC
  (NMLS #1416362) originates and services the loan program on behalf of its
  lending partners. Merchants enroll to offer financing to their customers and
  manage applications through the GreenSky merchant portal, while consumers
  manage accounts and payments through the customer portal. Surfaced as a
  portfolio company of ICONIQ Capital and QED Investors and added to the API
  Evangelist network. GreenSky is a consumer/merchant fintech with no public
  developer API surface; this profile is enriched with identity, link, and
  security metadata only.
